<!doctype html>
<html>
  <head>
    <title>2nd class</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* * = all elements */
      * {
        margin: 0;
        padding: 0;
      }
      /* # = id attribute */

      #my-pragraph {
        color: red;
        background-color: blue;
      }
      h3 {
        color: purple;
        font-size: 10px;
      }
      h4 {
        border: 1px solid orange;
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      }

      /* "." = class attribute */
      .same-pragraph {
        color: purple;
      }

      /* we cannot use same id for other elements */
      /* & id is unique & one name of id is  used for only one element */

      /* class attribute (we can use same class name for multiple elements)*/

      /* bahar se space k liye ap use karoge margin */
      /* andar se space k liye ap use karoge padding */
      /* span { */
      div {
        background-color: orange;
        color: white;
        margin-top: 30px;
        /* padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px; */
        padding: 20px;
        /* ye padding 4ro traf apply se hogi */
      }

      span {
        background-color: orange;
        color: white;
        margin-top: 10px;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <p id="my-pragraph">this is a pragraph</p>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <p class="same-pragraph">same pragraph</p>
    <p class="same-pragraph">same pragraph</p>
    <p>this is a paragraph</p>
    <span>This is span element</span>
    <div>This is div element</div>
  </body>
</html>
