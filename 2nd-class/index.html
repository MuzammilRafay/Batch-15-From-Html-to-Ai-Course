<!doctype html>
<html>
  <head>
    <title>2nd class</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      /* # = id attribute */

      #my-pragraph {
        color: red;
        background-color: blue;
      }
      h3 {
        color: purple;
        font-size: 10px;
      }
      h4 {
        border: 1px solid orange;
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      }

      /* "." = class attribute */
      .same-pragraph {
        color: purple;
      }

      /* we cannot use same id for other elements */
      /* & id is unique & one name of id is  used for only one element */

      /* class attribute (we can use same class name for multiple elements)*/
    </style>
  </head>

  <body>
    <p id="my-pragraph">this is a pragraph</p>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <p class="same-pragraph">same pragraph</p>
    <p class="same-pragraph">same pragraph</p>
    <p>this is a paragraph</p>
  </body>
</html>
